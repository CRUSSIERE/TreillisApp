<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treillis d'agrégats OLAP</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --line: #d8dce3;
    --ink: #1c2430;
    --muted: #6b7684;
    --accent: #2f6fd0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: var(--bg);
  }

  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }

  button, select, input { font: inherit; color: inherit; }
  button {
    padding: 6px 11px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); cursor: pointer;
  }
  button:hover:not(:disabled) { background: #eef1f5; }
  button:disabled { opacity: .35; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.08); }
  .modes { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .modes button { border: 0; border-radius: 0; }
  .modes button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  main { flex: 1; display: flex; min-height: 0; }

  #panel {
    width: 320px; flex: none; overflow-y: auto; padding: 14px;
    background: var(--panel); border-right: 1px solid var(--line);
  }
  #panel h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 18px 0 8px;
  }
  #panel h2:first-child { margin-top: 0; }
  .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .row input[type=text] {
    flex: 1; min-width: 0; padding: 5px 8px;
    border: 1px solid var(--line); border-radius: 5px;
  }
  .row select { padding: 5px 6px; border: 1px solid var(--line); border-radius: 5px; }
  .icon {
    flex: none; width: 26px; padding: 5px 0; text-align: center;
    color: var(--muted); line-height: 1;
  }
  .dim { border: 1px solid var(--line); border-radius: 7px; padding: 10px; margin-bottom: 10px; }
  .dim .levels { margin: 6px 0 0 10px; padding-left: 10px; border-left: 2px solid var(--line); }
  .cases { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; }
  .cases label { display: inline-flex; align-items: center; gap: 3px; cursor: pointer; }
  .row.faibles { margin: -2px 0 8px 0; }
  .row.faibles input { font-size: 12px; color: var(--muted); }
  .dim .all { color: var(--muted); font-style: italic; padding: 5px 0 0 8px; font-size: 13px; }
  .add { width: 100%; margin-top: 4px; }
  .row .grow { flex: 1; }
  .dlabel {
    flex: none; width: 86px; font-size: 12px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row select[data-field="agg-level"] { flex: 1; min-width: 0; }
  .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  .hint.alerte { color: #b91c1c; }

  #view { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #canvas { flex: 1; overflow: auto; padding: 20px; }
  #canvas .hint { margin: 0; }
  .error {
    padding: 10px 12px; border-radius: 6px;
    background: #fdecec; border: 1px solid #f0b4b4; color: #8d2020;
  }
  #sql { border-top: 1px solid var(--line); background: var(--panel); }
  #sql summary { padding: 8px 16px; cursor: pointer; font-weight: 600; }
  #sql pre {
    margin: 0; padding: 0 16px 14px; max-height: 260px; overflow: auto;
    font: 12.5px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
  }
</style>
<script>
  // Un module ES qui echoue ne laisse aucune trace a l'ecran : la page reste
  // blanche, sans message. Ce filet attrape le cas et dit quoi faire.
  // Cause la plus frequente : GitHub Pages sert index.html et lattice.js avec
  // max-age=600 chacun de son cote, donc un index.html neuf peut tomber sur
  // un lattice.js encore en cache -- d'ou le ?v= sur l'import, qui evite
  // normalement d'en arriver la.
  window.__bootError = null
  window.addEventListener('error', (e) => {
    window.__bootError = e.message || (e.error && e.error.message) || null
  }, true)
  window.addEventListener('load', () => {
    const panel = document.getElementById('panel')
    if (!panel || panel.children.length > 0) return
    document.getElementById('canvas').innerHTML =
      '<div class="error"><strong>L\'application n\'a pas pu démarrer.</strong>' +
      '<br>Recharge en forçant le cache : <kbd>Ctrl</kbd>+<kbd>F5</kbd>' +
      ' (<kbd>Cmd</kbd>+<kbd>Maj</kbd>+<kbd>R</kbd> sur Mac).' +
      (window.__bootError ? '<br><small>' + window.__bootError + '</small>' : '') +
      '</div>'
  })
</script>
</head>
<body>

<header>
  <h1>Treillis d'agrégats OLAP</h1>
  <div class="modes">
    <button id="mode-complete" aria-pressed="true">Treillis complet</button>
    <button id="mode-partial" aria-pressed="false">Treillis partiel</button>
  </div>
  <span id="count" class="hint"></span>
  <span class="spacer"></span>
  <button id="btn-import">Importer JSON</button>
  <button id="btn-export">Exporter JSON</button>
  <select id="fmt" title="Format d'image">
    <option value="png">PNG</option>
    <option value="jpeg">JPG</option>
    <option value="svg">SVG</option>
  </select>
  <button id="btn-image" class="primary">Exporter l'image</button>
  <input id="file" type="file" accept="application/json,.json" hidden>
</header>

<main>
  <div id="panel"></div>
  <div id="view">
    <div id="canvas"></div>
    <details id="sql" hidden>
      <summary>SQL des vues matérialisées</summary>
      <pre id="sql-text"></pre>
    </details>
  </div>
</main>

<script type="module">
import {
  AGGREGATIONS, ALL, MAX_NODES, aggregateNames, baseKey, buildLattice,
  derivations, fromOlapSchema, fromOwnFormat, isOlapSchema, keyOf, latticeSize,
  analysisIssue, availableWeak, displayLabel, parseKey, pruneSelection,
  selectionSize, sortKeys, toOwnFormat, toSql, validSources, analysisSource,
  // ?v= : index.html et lattice.js ont chacun leur cache de 10 min sur
  // GitHub Pages. Sans ce marqueur, une page fraiche peut charger un module
  // perime, qui n'exporte pas encore ce qu'elle importe -> page blanche.
  // A INCREMENTER a chaque modification de lattice.js.
} from './lattice.js?v=9'
import { diagramSvg, esc } from './render.js?v=1'
import { downloadJson, exportImage } from './files.js?v=1'

/* ------------------------------------------------------------------ */
/* Etat                                                                */
/* ------------------------------------------------------------------ */

/** Exemple de depart : la planche p.34 du cours, 4 x 4 = 16 noeuds. */
const EXEMPLE_COURS = () => ({
  factName: 'VENTES',
  measures: [
    { name: 'quantite', agg: 'SUM' },
    { name: 'montant', agg: 'SUM' },
  ],
  dimensions: [
    { name: 'PRODUITS', levels: ['codeP', 'sous_categ', 'categorie'], hierarchies: [] },
    { name: 'TEMPS', levels: ['codeT', 'num_mois', 'annee'], hierarchies: [] },
  ],
  materialized: [],
  sources: {}, // cle d'agregat -> cle de sa source imposee ; absent = automatique
  analyses: [],
  freeArrows: [], // tracees a la main, sans rapport avec l'ordre du treillis
  mode: 'complete',
})

let state = EXEMPLE_COURS()

const $ = (sel) => document.querySelector(sel)
/** dimensions retenues pour le treillis : une dimension sans niveau n'est pas
 *  un axe. Toute la vue passe par ce filtre, y compris le calcul de la cle de
 *  base -- sinon un clic et un dessin porteraient sur des tuples d'arites
 *  differentes. */
const axes = () => state.dimensions.filter((d) => d.levels.length > 0)

function applyPrune() {
  Object.assign(state, pruneSelection(state, axes()))
}

/**
 * Garde-fou avant une modification de structure. Retirer une dimension ou un
 * niveau change l'arite des cles : agregats, sources imposees et fleches
 * libres deviennent caducs et disparaissent. L'app n'a pas d'annulation, donc
 * on chiffre la perte en simulant l'elagage sur les dimensions *futures*, et
 * on ne demande que si quelque chose serait reellement perdu.
 */
function accepteLaPerte(dimensionsApres) {
  const apres = pruneSelection(state, dimensionsApres.filter((d) => d.levels.length > 0))
  const perdus = selectionSize(state) - selectionSize(apres)
  if (perdus <= 0) return true
  return confirm(
    `Cette suppression retire ${perdus} élément${perdus > 1 ? 's' : ''} de ta sélection ` +
      `(agrégats matérialisés, sources imposées, flèches). ` +
      `C'est irréversible. Continuer ?`,
  )
}

/* ------------------------------------------------------------------ */
/* Panneau de saisie                                                   */
/* ------------------------------------------------------------------ */

function renderPanel() {
  const dims = state.dimensions
    .map((d, i) => {
      const alt =
        d.hierarchies && d.hierarchies.length > 1
          ? `<div class="row">
               <select data-field="hier" data-d="${i}" title="Hiérarchie servant d'axe">
                 ${d.hierarchies
                   .map(
                     (h) =>
                       `<option${h.levels.join() === d.levels.join() ? ' selected' : ''}>${esc(h.name)}</option>`,
                   )
                   .join('')}
               </select>
             </div>`
          : ''

      const levels = d.levels
        .map(
          (lv, j) => `<div class="row">
            <input type="text" data-field="level" data-d="${i}" data-l="${j}" value="${esc(lv)}">
            <button class="icon" data-act="move-level" data-d="${i}" data-l="${j}" data-dir="-1"
              title="Vers le plus fin"${j === 0 ? ' disabled' : ''}>&#9650;</button>
            <button class="icon" data-act="move-level" data-d="${i}" data-l="${j}" data-dir="1"
              title="Vers le plus général"${j === d.levels.length - 1 ? ' disabled' : ''}>&#9660;</button>
            <button class="icon" data-act="del-level" data-d="${i}" data-l="${j}"
              title="Supprimer ce niveau">&times;</button>
          </div>
          <div class="row faibles">
            <input type="text" data-field="weak" data-d="${i}" data-l="${j}"
              placeholder="attributs faibles, séparés par des virgules"
              value="${esc((d.weak?.[j] ?? []).join(', '))}">
          </div>`,
        )
        .join('')

      return `<div class="dim">
        <div class="row">
          <input type="text" data-field="dim-name" data-d="${i}" value="${esc(d.name)}">
          <button class="icon" data-act="del-dim" data-d="${i}" title="Supprimer la dimension">&times;</button>
        </div>
        ${alt}
        <div class="levels">
          ${levels}
          <div class="all">${ALL} &mdash; ajouté automatiquement</div>
        </div>
        <button class="add" data-act="add-level" data-d="${i}">+ niveau</button>
      </div>`
    })
    .join('')

  const measures = state.measures
    .map(
      (m, i) => `<div class="row">
        <input type="text" data-field="measure-name" data-m="${i}" value="${esc(m.name)}">
        <select data-field="measure-agg" data-m="${i}">
          ${AGGREGATIONS.map((a) => `<option${a === m.agg ? ' selected' : ''}>${a}</option>`).join('')}
        </select>
        <button class="icon" data-act="del-measure" data-m="${i}" title="Supprimer la mesure">&times;</button>
      </div>`,
    )
    .join('')

  $('#panel').innerHTML = `
    <h2>Fait</h2>
    <div class="row"><input type="text" data-field="factName" value="${esc(state.factName)}"></div>

    <h2>Mesures</h2>
    ${measures}
    <button class="add" data-act="add-measure">+ mesure</button>

    <h2>Dimensions</h2>
    <p class="hint">Niveaux ordonnés du plus fin (la clé) au plus général.</p>
    ${dims}
    <button class="add" data-act="add-dim">+ dimension</button>

    <h2>Agrégats à matérialiser</h2>
    ${renderAggregates()}

    <h2>Analyses</h2>
    ${renderAnalyses()}

    <h2>Flèches libres</h2>
    ${renderFreeArrows()}
  `
}

/** Fleches tracees a la main entre deux elements quelconques du schema.
 *  Elles ne disent rien du treillis -- ni derivation, ni rattachement : elles
 *  servent a annoter. D'ou le violet, distinct des deux autres familles. */
function renderFreeArrows() {
  const boites = drawnBoxes()
  if (boites.length < 2) {
    return '<p class="hint">Il faut au moins deux éléments affichés.</p>'
  }
  const options = (choisi) =>
    boites
      .map((b) => `<option value="${esc(b.key)}"${b.key === choisi ? ' selected' : ''}>${esc(b.label)}</option>`)
      .join('')

  const rows = state.freeArrows
    .map(
      (f, i) => `<div class="dim">
        <div class="row">
          <input type="text" class="grow" data-field="arrow-label" data-i="${i}"
            placeholder="libellé (facultatif)" value="${esc(f.label ?? '')}">
          <button class="icon" data-act="del-arrow" data-i="${i}" title="Supprimer la flèche">&times;</button>
        </div>
        <div class="row">
          <span class="dlabel">de</span>
          <select data-field="arrow-from" data-i="${i}">${options(f.from)}</select>
        </div>
        <div class="row">
          <span class="dlabel">vers</span>
          <select data-field="arrow-to" data-i="${i}">${options(f.to)}</select>
        </div>
      </div>`,
    )
    .join('')

  return `
    <p class="hint">Relie deux éléments quelconques, sans rapport avec l’ordre
      du treillis. Purement graphique : sans effet sur le SQL.</p>
    ${rows}
    <button class="add" data-act="add-arrow">+ flèche</button>`
}

/** Les requetes frequentes de la p.35. Une analyse ne se rattache pas a la
 *  main : l'app cherche l'agregat le plus grossier qui reste assez fin pour y
 *  repondre, ce qui montre du meme coup celles que rien n'accelere. */
function renderAnalyses() {
  const dims = axes()
  if (dims.length === 0) return '<p class="hint">Définis d’abord une dimension.</p>'

  const mats = [...state.materialized, baseKey(dims)]
  const names = aggregateNames(state.materialized, dims, state.factName)

  const rows = state.analyses
    .map((a, i) => {
      const selects = dims
        .map(
          (d, di) => `<div class="row">
            <span class="dlabel">${esc(d.name)}</span>
            <select data-field="ana-level" data-i="${i}" data-d="${di}">
              ${[...d.levels, ALL]
                .map(
                  (lv, li) =>
                    `<option value="${li}"${li === a.levels[di] ? ' selected' : ''}>${esc(lv)}</option>`,
                )
                .join('')}
            </select>
          </div>`,
        )
        .join('')
      const auto = analysisSource(a.levels, mats, dims)
      const cible = a.target && mats.includes(a.target) ? a.target : auto
      const manque = analysisIssue(a.levels, cible, dims)
      const options = sortKeys(mats)
        .map(
          (k) =>
            `<option value="${esc(k)}"${a.target === k ? ' selected' : ''}>${esc(names.get(k) ?? k)}</option>`,
        )
        .join('')
      const pointe = `<div class="row">
        <span class="dlabel">pointe vers</span>
        <select data-field="ana-target" data-i="${i}">
          <option value=""${a.target ? '' : ' selected'}>auto — ${esc(names.get(auto) ?? '')}</option>
          ${options}
        </select>
      </div>`
      const faibles = availableWeak(a.levels, dims)
      const casesFaibles = faibles.length
        ? `<div class="row"><span class="dlabel">attributs faibles</span>
             <span class="grow cases">${faibles
               .map(
                 (w) => `<label title="${esc(`${w.dimension} · ${w.level}`)}">
                   <input type="checkbox" data-field="ana-extra" data-i="${i}"
                     data-n="${esc(w.name)}"${a.extras?.includes(w.name) ? ' checked' : ''}>
                   ${esc(w.name)}</label>`,
               )
               .join('')}</span>
           </div>`
        : ''
      const etat = manque.length
        ? `<p class="hint alerte">⚠ ${esc(names.get(cible) ?? '?')} est trop agrégé sur
             ${esc(manque.join(', '))} : il ne peut pas répondre à cette analyse.</p>`
        : `<p class="hint">servie par <strong>${esc(names.get(cible) ?? '?')}</strong></p>`
      return `<div class="dim">
        <div class="row">
          <input type="text" class="grow" data-field="ana-name" data-i="${i}" value="${esc(a.name)}">
          <button class="icon" data-act="del-ana" data-i="${i}" title="Supprimer l’analyse">&times;</button>
        </div>
        <div class="row">
          <span class="dlabel">mesure</span>
          <select data-field="ana-measure" data-i="${i}">
            ${state.measures
              .map(
                (m) =>
                  `<option${m.name === a.measure ? ' selected' : ''}>${esc(m.name)}</option>`,
              )
              .join('')}
          </select>
        </div>
        ${selects}
        ${casesFaibles}
        ${pointe}
        ${etat}
      </div>`
    })
    .join('')

  return `
    <p class="hint">Les requêtes fréquentes. L’app relie chacune à l’agrégat
      qui peut y répondre ; retomber sur ${esc(state.factName)} signifie
      qu’aucun agrégat ne l’accélère.</p>
    ${rows}
    <button class="add" data-act="add-ana">+ analyse</button>`
}

/** Construction explicite du treillis partiel : un agregat = un niveau par
 *  dimension, choisi dans une liste. Le clic sur le canvas fait la meme chose,
 *  mais devient impraticable des que le treillis complet compte des dizaines
 *  de noeuds -- et en mode partiel les noeuds non materialises ne sont plus
 *  affiches, donc il n'y a rien a cliquer. */
function renderAggregates() {
  const dims = axes()
  if (dims.length === 0) return '<p class="hint">Définis d’abord une dimension.</p>'

  const names = aggregateNames(state.materialized, dims, state.factName)
  const rows = state.materialized
    .map((key, i) => {
      const node = parseKey(key)
      const selects = dims
        .map(
          (d, di) => `<div class="row">
            <span class="dlabel">${esc(d.name)}</span>
            <select data-field="agg-level" data-i="${i}" data-d="${di}">
              ${[...d.levels, ALL]
                .map(
                  (lv, li) =>
                    `<option value="${li}"${li === node[di] ? ' selected' : ''}>${esc(lv)}</option>`,
                )
                .join('')}
            </select>
          </div>`,
        )
        .join('')
      const auto = derivations(state.materialized, dims, {}).find((l) => l.to === key)?.from
      const choix = validSources(key, state.materialized, dims)
        .map(
          (k) =>
            `<option value="${esc(k)}"${state.sources[key] === k ? ' selected' : ''}>${esc(names.get(k) ?? k)}</option>`,
        )
        .join('')
      const source = `<div class="row">
        <span class="dlabel">calculé depuis</span>
        <select data-field="agg-source" data-k="${esc(key)}">
          <option value=""${state.sources[key] ? '' : ' selected'}>auto — ${esc(names.get(auto) ?? '')}</option>
          ${choix}
        </select>
      </div>`

      return `<div class="dim">
        <div class="row">
          <strong class="grow">${esc(names.get(key) ?? '')}</strong>
          <button class="icon" data-act="del-agg" data-i="${i}" title="Retirer cet agrégat">&times;</button>
        </div>
        ${selects}
        ${source}
      </div>`
    })
    .join('')

  return `
    <p class="hint">Un agrégat = un niveau par dimension.
      <em>${ALL}</em> agrège la dimension entièrement.
      Les données détaillées (${esc(state.factName)}) sont toujours là, implicitement.</p>
    ${rows}
    <button class="add" data-act="add-agg">+ agrégat</button>`
}

/* ------------------------------------------------------------------ */
/* Dessin du treillis                                                  */
/* ------------------------------------------------------------------ */

/** Ce que le canvas affiche en ce moment : le panneau des fleches libres ne
 *  doit proposer que des extremites reellement visibles. */
function drawnBoxes() {
  const dims = axes()
  if (dims.length === 0) return []
  let nodes
  try {
    nodes = buildLattice(dims).nodes
  } catch {
    return []
  }
  const base = baseKey(dims)
  const mats = new Set([...state.materialized, base])
  const names = aggregateNames([...mats], dims, state.factName)
  const visibles = state.mode === 'partial' ? nodes.filter((n) => mats.has(n.key)) : nodes
  return [
    ...visibles.map((n) => ({
      key: n.key,
      label: `${names.get(n.key) ? names.get(n.key) + ' — ' : ''}${displayLabel(parseKey(n.key), dims)}`,
    })),
    ...state.analyses.map((a) => ({ key: `A:${a.id}`, label: a.name })),
  ]
}

function renderCanvas() {
  const host = $('#canvas')
  const dims = axes()

  const bail = (html, count = '') => {
    host.innerHTML = html
    $('#count').textContent = count
    $('#sql').hidden = true
  }

  if (dims.length === 0) {
    return bail('<p class="hint">Ajoute au moins une dimension avec un niveau.</p>')
  }

  let lattice
  try {
    lattice = buildLattice(dims)
  } catch (err) {
    return bail(`<div class="error">${esc(err.message)}</div>`, `${latticeSize(dims)} nœuds (max ${MAX_NODES})`)
  }

  const base = baseKey(dims)
  const mats = new Set([...state.materialized, base])
  const partial = state.mode === 'partial'
  const names = aggregateNames([...mats], dims, state.factName)

  // etiquette posee a droite de chaque boite (VENTES, Agg1...)
  const tagOf = (key) => (partial ? names.get(key) ?? '' : key === base ? state.factName : '')

  // `All` ne s'affiche pas : une dimension totalement agregee n'apporte rien
  // a la lecture du noeud
  const items = (partial ? lattice.nodes.filter((n) => mats.has(n.key)) : lattice.nodes).map(
    (n) => ({ ...n, label: displayLabel(parseKey(n.key), dims), tag: tagOf(n.key) }),
  )

  // Analyses : une bande au-dessus du treillis. La cle prefixee `A:` les
  // distingue des noeuds, qui sont des tuples de chiffres -- pas de collision.
  // On resout ici le rattachement et sa validite : render.js ne connait pas
  // la semantique OLAP, il ne fait que placer et dessiner.
  const analyses = state.analyses.map((a) => {
    const measure = state.measures.find((m) => m.name === a.measure)
    const target = a.target && mats.has(a.target)
      ? a.target
      : analysisSource(a.levels, [...mats], dims)
    return {
      key: `A:${a.id}`,
      rank: 0,
      label: a.name,
      tag:
        `${measure ? `${measure.agg}(${measure.name}) · ` : ''}` +
        displayLabel(a.levels, dims) +
        (a.extras?.length ? ` + ${a.extras.join(', ')}` : ''),
      target,
      issue: analysisIssue(a.levels, target, dims),
    }
  })

  const edges = partial
    ? derivations([...mats], dims, state.sources).map((e) => ({ ...e, deriv: true }))
    : lattice.edges

  host.innerHTML = diagramSvg({
    items,
    analyses,
    edges,
    freeArrows: state.freeArrows,
    names,
    base,
    materialized: mats,
  })

  const total = lattice.nodes.length
  $('#count').textContent = partial
    ? `${mats.size} nœud${mats.size > 1 ? 's' : ''} matérialisé${mats.size > 1 ? 's' : ''} sur ${total}`
    : `${total} nœuds — clique pour matérialiser`

  $('#sql').hidden = !partial
  if (partial) {
    $('#sql-text').textContent = toSql(dims, state.measures, [...mats], state.factName, state.sources)
  }
}

function render() {
  applyPrune()
  renderPanel()
  renderCanvas()
}

/* ------------------------------------------------------------------ */
/* Interactions du panneau                                             */
/* ------------------------------------------------------------------ */

$('#panel').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-act]')
  if (!btn) return
  const d = Number(btn.dataset.d)
  const l = Number(btn.dataset.l)
  const m = Number(btn.dataset.m)

  switch (btn.dataset.act) {
    case 'add-dim':
      state.dimensions.push({
        name: `DIMENSION${state.dimensions.length + 1}`,
        levels: ['cle'],
        hierarchies: [],
      })
      break
    case 'del-dim': {
      if (!accepteLaPerte(state.dimensions.filter((_, k) => k !== d))) return
      state.dimensions.splice(d, 1)
      break
    }
    case 'add-level':
      state.dimensions[d].levels.push(`niveau${state.dimensions[d].levels.length + 1}`)
      break
    case 'del-level': {
      const apres = state.dimensions.map((dim, k) =>
        k === d ? { ...dim, levels: dim.levels.filter((_, m) => m !== l) } : dim,
      )
      if (!accepteLaPerte(apres)) return
      state.dimensions[d].levels.splice(l, 1)
      break
    }
    case 'move-level': {
      const levels = state.dimensions[d].levels
      const to = l + Number(btn.dataset.dir)
      if (to < 0 || to >= levels.length) return
      ;[levels[l], levels[to]] = [levels[to], levels[l]]
      break
    }
    case 'add-measure':
      state.measures.push({ name: `mesure${state.measures.length + 1}`, agg: 'SUM' })
      break
    case 'del-measure':
      state.measures.splice(m, 1)
      break
    case 'add-agg': {
      // premier noeud libre dans l'ordre du treillis : jamais un doublon,
      // jamais la base, et le meme a chaque fois
      const dims = axes()
      const used = new Set([...state.materialized, baseKey(dims)])
      let free
      try {
        free = buildLattice(dims).nodes.find((n) => !used.has(n.key))
      } catch {
        return // treillis trop grand : le canvas affiche deja l'erreur
      }
      if (!free) return
      state.materialized.push(free.key)
      break
    }
    case 'del-agg':
      state.materialized.splice(Number(btn.dataset.i), 1)
      break
    case 'add-ana':
      state.analyses.push({
        id: `an${Date.now().toString(36)}${state.analyses.length}`,
        name: `A${state.analyses.length + 1}`,
        extras: [],
        levels: axes().map(() => 0),
        measure: state.measures[0]?.name ?? '',
      })
      break
    case 'del-ana':
      state.analyses.splice(Number(btn.dataset.i), 1)
      break
    case 'add-arrow': {
      const boites = drawnBoxes()
      if (boites.length < 2) return
      state.freeArrows.push({ from: boites[0].key, to: boites[1].key, label: '' })
      break
    }
    case 'del-arrow':
      state.freeArrows.splice(Number(btn.dataset.i), 1)
      break
    default:
      return
  }
  render()
})

// Frappe au clavier : seul le dessin est refait. Redessiner le panneau
// arracherait le focus du champ en cours de saisie a chaque caractere.
$('#panel').addEventListener('input', (e) => {
  const el = e.target
  const d = Number(el.dataset.d)
  switch (el.dataset.field) {
    case 'factName': state.factName = el.value; break
    case 'dim-name': state.dimensions[d].name = el.value; break
    case 'level': state.dimensions[d].levels[Number(el.dataset.l)] = el.value; break
    case 'measure-name': state.measures[Number(el.dataset.m)].name = el.value; break
    case 'ana-name': state.analyses[Number(el.dataset.i)].name = el.value; break
    case 'arrow-label': state.freeArrows[Number(el.dataset.i)].label = el.value; break
    case 'weak': {
      const dim = state.dimensions[d]
      const liste = el.value.split(',').map((x) => x.trim()).filter(Boolean)
      dim.weak = { ...(dim.weak ?? {}) }
      if (liste.length) dim.weak[Number(el.dataset.l)] = liste
      else delete dim.weak[Number(el.dataset.l)]
      break
    }
    default: return
  }
  renderCanvas()
})

$('#panel').addEventListener('change', (e) => {
  const el = e.target
  if (el.dataset.field === 'weak') {
    render()
  } else if (el.dataset.field === 'measure-agg') {
    state.measures[Number(el.dataset.m)].agg = el.value
    renderCanvas()
  } else if (el.dataset.field === 'agg-level') {
    const i = Number(el.dataset.i)
    const node = parseKey(state.materialized[i])
    node[Number(el.dataset.d)] = Number(el.value)
    // un agregat amene sur un voisin deja present fusionne avec lui :
    // pruneMaterialized dedoublonne, la ligne en trop disparait
    state.materialized[i] = keyOf(node)
    render()
  } else if (el.dataset.field === 'agg-source') {
    // valeur vide = on rend la main au calcul automatique
    if (el.value) state.sources[el.dataset.k] = el.value
    else delete state.sources[el.dataset.k]
    render()
  } else if (el.dataset.field === 'ana-level') {
    state.analyses[Number(el.dataset.i)].levels[Number(el.dataset.d)] = Number(el.value)
    render()
  } else if (el.dataset.field === 'ana-extra') {
    const ana = state.analyses[Number(el.dataset.i)]
    const nom = el.dataset.n
    ana.extras = el.checked
      ? [...new Set([...(ana.extras ?? []), nom])]
      : (ana.extras ?? []).filter((x) => x !== nom)
    render()
  } else if (el.dataset.field === 'arrow-from' || el.dataset.field === 'arrow-to') {
    state.freeArrows[Number(el.dataset.i)][el.dataset.field === 'arrow-from' ? 'from' : 'to'] = el.value
    render()
  } else if (el.dataset.field === 'ana-target') {
    // valeur vide = on rend la main au rattachement calcule
    if (el.value) state.analyses[Number(el.dataset.i)].target = el.value
    else delete state.analyses[Number(el.dataset.i)].target
    render()
  } else if (el.dataset.field === 'ana-measure') {
    state.analyses[Number(el.dataset.i)].measure = el.value
    render()
  } else if (el.dataset.field === 'hier') {
    const dim = state.dimensions[Number(el.dataset.d)]
    const chosen = dim.hierarchies.find((h) => h.name === el.value)
    if (chosen) {
      dim.levels = [...chosen.levels]
      render()
    }
  }
})

/* Selection des noeuds a materialiser */
$('#canvas').addEventListener('click', (e) => {
  const g = e.target.closest('[data-key]')
  if (!g) return
  const key = g.dataset.key
  if (key.startsWith('A:')) return // une analyse n'est pas un noeud du treillis
  if (key === baseKey(axes())) return // la table de faits n'est pas optionnelle

  const i = state.materialized.indexOf(key)
  if (i >= 0) state.materialized.splice(i, 1)
  else state.materialized.push(key)
  renderCanvas()
})

/* ------------------------------------------------------------------ */
/* Modes                                                               */
/* ------------------------------------------------------------------ */

function setMode(mode) {
  state.mode = mode
  $('#mode-complete').setAttribute('aria-pressed', String(mode === 'complete'))
  $('#mode-partial').setAttribute('aria-pressed', String(mode === 'partial'))
  renderCanvas()
}
$('#mode-complete').onclick = () => setMode('complete')
$('#mode-partial').onclick = () => setMode('partial')

/* ------------------------------------------------------------------ */
/* Import / export JSON                                                */
/* ------------------------------------------------------------------ */

/** nom de fichier tire du fait : tout ce qui n'est pas sur dans un nom de
 *  fichier devient un souligne */
const slug = () => (state.factName || 'treillis').replace(/[^\w.-]+/g, '_') || 'treillis'

$('#btn-export').onclick = () => downloadJson(toOwnFormat(state), `${slug()}-treillis.json`)

$('#btn-import').onclick = () => $('#file').click()

$('#file').addEventListener('change', async (e) => {
  const file = e.target.files[0]
  if (!file) return
  e.target.value = '' // reimporter le meme fichier doit redeclencher l'evenement
  try {
    const json = JSON.parse(await file.text())
    state = isOlapSchema(json)
      ? { ...fromOlapSchema(json), materialized: [], mode: state.mode }
      : fromOwnFormat(json)
    setMode(state.mode)
    render()
  } catch (err) {
    alert(`Import impossible : ${err.message}`)
  }
})

/* ------------------------------------------------------------------ */
/* Export image                                                        */
/* ------------------------------------------------------------------ */

$('#btn-image').onclick = () =>
  exportImage($('#svg'), $('#fmt').value, `${slug()}-treillis`).catch((err) => alert(err.message))

render()
</script>
</body>
</html>
